services:
  # MediaMTX RTSP/WebRTC/HLS Video Broker
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx_broker
    ports:
      - "8554:8554"  # RTSP
      - "8889:8889"  # WebRTC
      - "8888:8888"  # HLS
    restart: unless-stopped

  # PostgreSQL Persistence
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vehicle_analytics
    ports:
      - "5432:5432"
    volumes:
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # NVIDIA DeepStream Vision Pipeline
  deepstream:
    build:
      context: ./deepstream
      dockerfile: Dockerfile
    container_name: deepstream_pipeline
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/vehicle_analytics
    depends_on:
      - mediamtx
      - postgres
    restart: unless-stopped

  # Backend FastAPI Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analytics_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/vehicle_analytics
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: unless-stopped

  # React Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: analytics_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
